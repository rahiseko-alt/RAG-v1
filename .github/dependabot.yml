version: 2
updates:
  # 本体は Python（pyproject.toml + uv.lock）。依存は全て "==" で完全ピン留めして
  # いるため、ここを設定しないと脆弱性のあるバージョンに固定され続ける。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
