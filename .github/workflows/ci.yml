name: CI

# 機械の審判（machine judge）。Lint / テスト / 起動確認を機械的に検査する
# （AI の自己申告を証拠にしない。完了報告の evidence はこのワークフローの run URL / commit SHA を指す）。
#
# 依存は torch + CUDA スタックを含み cold install が重い（約 2.8GiB）。
# 二重に払わないよう、Lint・テスト・起動スモークは単一ジョブにまとめてある。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: lint / test / 起動スモーク
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 は下の「コミット衛生」検査が PR の差分コミットを
      # 辿るために必要（既定の shallow clone だと base..HEAD が解決できない）。
      # リポジトリは数MBなので全履歴取得のコストは無視できる。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 個人メールアドレスの流出を機械で止める。ローカルの git config は
      # クローンで運ばれず、人の設定漏れを口頭ルールで防ぐことはできないため、
      # 「AI の自己申告を証拠にしない」のと同じ理由でここで機械判定する。
      #
      # 検査対象は PR の差分コミットのみ。既存履歴には過去のマージコミット由来の
      # 個人メールが残っており、全履歴を対象にすると恒久的に赤になるため。
      # ⚠ マージコミットの author は GitHub 側が刻むので、この検査では止められない。
      #    そちらは GitHub アカウント設定 "Keep my email addresses private" で塞ぐ
      #    （AGENTS.md「公開リポジトリとしての規律」を参照）。
      - name: コミット衛生（author/committer メールが noreply か）
        if: github.event_name == 'pull_request'
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # noreply として許可する形: GitHub の noreply（ID付き/なし両方）と、
          # コミットを作る各エージェントの noreply。
          # ⚠ ローカル部に `[` `]` を含める必要がある。bot のアドレスが
          #    `49699333+dependabot[bot]@users.noreply.github.com` の形を取るため、
          #    角括弧を許可しないと Dependabot の PR が全て赤になる（実地で確認済み）。
          #    POSIX の括弧表現では `]` を先頭に置くとリテラルとして扱われる＝`[][A-Za-z...]`。
          allow='^([0-9]+\+)?[][A-Za-z0-9._-]+@users\.noreply\.github\.com$|^[][A-Za-z0-9._-]+@noreply\.[A-Za-z0-9.-]+$|^noreply@[A-Za-z0-9.-]+$'

          leaked=0
          while IFS='|' read -r sha email role; do
            [ -z "$sha" ] && continue
            if ! printf '%s' "$email" | grep -qE "$allow"; then
              echo "FAIL: $sha の $role メールが noreply ではありません: $email"
              leaked=1
            fi
          done <<EOF
          $(git log --no-merges --format='%H|%ae|author' "$base..HEAD"; git log --no-merges --format='%H|%ce|committer' "$base..HEAD")
          EOF

          if [ "$leaked" != "0" ]; then
            echo ""
            echo "対処: git config user.email を noreply アドレスに設定し、該当コミットを作り直してください。"
            echo "  git config --global user.email '<ID>+<username>@users.noreply.github.com'"
            exit 1
          fi
          echo "コミット衛生 OK: $base..HEAD の全コミットが noreply アドレス"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # pyproject.toml が requires-python = ">=3.12,<3.13"、uv.lock が "==3.12.*"。
      # 3.13 が来ると解決に失敗するので明示的に固定する。
      - name: Setup Python 3.12
        run: uv python install 3.12

      # ruff / pytest は [project.optional-dependencies] dev にあるため、
      # --extra dev を付けないとインストールされない（uv が自動で入れるのは
      # [dependency-groups] のみ）。ここを省くと ruff: command not found になる。
      - name: Install (locked)
        run: uv sync --locked --extra dev

      # 対象を src tests に限定する。notebooks/*.ipynb は教材として
      # 未使用 import やセミコロン区切りを意図的に含んでおり、
      # ruff check . だと 10 件の指摘で赤くなる（本体コードの問題ではない）。
      - name: Lint (ruff)
        run: uv run ruff check src tests

      # 型ゲート。新しいジョブではなくこのジョブのステップとして足している：
      #   - ci-green の needs: と比較式を触らずに済む（片方だけ直すと startup
      #     failure になり check run が生成されない＝上のコメント参照）
      #   - 重い依存(約2.8GiB)の install を二重に払わない
      - name: Types (mypy)
        run: uv run mypy src

      # e2e と slow を除外する理由は AGENTS.md「Testing instructions」に明記。
      # 除外分は手動実行の手順を同ファイルに残してある（黙って除外しない）。
      - name: Test (pytest)
        run: uv run pytest -m "not e2e and not slow" -q

      # 到達性を外部事実(HTTP 200＋本文マーカー)で縛る。スクショにしない。
      # GET / は静的な UI を返すだけで、ナレッジ revision の初期化を要求しない。
      - name: Smoke (uvicorn → curl 200 + marker)
        run: |
          uv run uvicorn src.api:app --host 127.0.0.1 --port 8010 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/ || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "FAIL: server did not return 200 within timeout (last code: ${code:-none})"
            exit 1
          fi

          body=$(curl -sf http://127.0.0.1:8010/)
          if ! printf '%s' "$body" | grep -q 'medguide-rag 運用ワークベンチ'; then
            echo "FAIL: body did not contain marker 'medguide-rag 運用ワークベンチ'"
            exit 1
          fi

          echo "SMOKE OK: HTTP 200 かつ本文に 'medguide-rag 運用ワークベンチ' を確認"

  # 集約ゲート＝branch protection が要求する「安定した1つの必須チェック」。
  # 内部ジョブ(quality)の名前や中身が変わっても context 名は 'ci-green' で不変。
  # scripts/setup.sh はこの 'ci-green' だけを必須指定する。
  # ⚠ 上流ジョブを増減させたら needs: と下の比較式の両方を必ず同時に直すこと。
  #    片方だけだと workflow が startup failure になり、ci-green の check run が
  #    生成されず branch protection が永久に待ち状態になる。
  gate:
    name: ci-green
    needs: [quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 上流ジョブが全て success か検査（1つでも失敗/スキップなら赤）
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "ci-green: FAIL (quality=${{ needs.quality.result }})"
            exit 1
          fi
          echo "ci-green: OK（quality が success）"
