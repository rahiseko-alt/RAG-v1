name: CodeQL

# 静的解析。public リポなので code scanning が無料で使える。
# 結果は GitHub Security → Code scanning に上がり、run URL が evidence になる。
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # 毎週月曜 03:00 UTC に定期スキャン

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 本体は Python（src/ 配下の API・RAG エンジン・SQLite ストア）だが、
        # ワークベンチ UI の src/api/static/app.js も実コードなので両方走らせる。
        # python だけにすると、既定ブランチ側に存在する javascript-typescript の
        # 設定が見つからず「1 configuration not found」で check が赤くなる。
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}

      # どちらもビルド不要（CodeQL が解析）。
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
