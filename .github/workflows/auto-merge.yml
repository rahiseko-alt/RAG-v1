name: auto-merge

# 日常のマージから人間を外す仕組み。
# 判定は「機械と門が全部緑か」の1点：
#   - CI(check runs: quality / smoke 等) が全て success
#   - commit status(prod-smoke) が combined success
#   - PR が同一リポ発・非draft・mergeable・`hold` ラベル無し
# これらが揃った main 向け PR を squash マージする。人間はボタンを押さない。
# 承認の階層（tier）は設けない（AGENTS.md「検証の規律」＝承認はシンプル、を参照）。
#
# ※ private 無料プランでも動くよう、branch protection の auto-merge 機能ではなく
#   トークンによる明示マージで実装する（GITHUB_TOKEN が主体）。

# ⚠ 一時無効化中（自動トリガーを外し、手動実行でのみ動く状態にしてある）。
#
# 理由: このワークフローは `gh pr merge --squash --delete-branch` を人手の承認なしに
# 実行する。main には branch protection がまだ掛かっておらず、これが唯一かつ
# 制御不能なマージ経路になっていた。medguide-rag の 13 コミットの開発履歴は
# ポートフォリオの成果物そのもの（セッションレポートが commit SHA を evidence として
# 参照している）であり、squash されると到達不能になる。
#
# 再有効化の条件: AGENTS.md「手順0」の branch protection / Ruleset を main に適用し、
# `ci-green` が必須チェックとして機能していることを確認したうえで、squash ではなく
# マージコミットを作る方式に直してから、下の on: を元に戻すこと。
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  evaluate:
    # check run 名を "auto-merge" に固定し、自己チェックを完全一致で除外する（部分一致は緩く危険）。
    name: auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: 評価してマージ
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # main 向けの open PR を列挙（同一リポ発のみ）。
          prs="$(gh api "repos/$REPO/pulls?state=open&base=main&per_page=50" \
            --jq '.[] | select(.head.repo.full_name==.base.repo.full_name) | .number')"

          if [ -z "$prs" ]; then
            echo "対象の open PR なし。"
            exit 0
          fi

          for pr in $prs; do
            echo "=== PR #$pr を評価 ==="
            meta="$(gh api "repos/$REPO/pulls/$pr")"
            draft="$(jq -r '.draft' <<<"$meta")"
            mergeable="$(jq -r '.mergeable' <<<"$meta")"
            sha="$(jq -r '.head.sha' <<<"$meta")"
            labels="$(jq -r '[.labels[].name] | join(",")' <<<"$meta")"

            if [ "$draft" = "true" ]; then echo "skip: draft"; continue; fi
            if grep -qw 'hold' <<<"${labels//,/ }"; then echo "skip: hold ラベル"; continue; fi

            # 1) commit status（prod-smoke 等）の combined が success か
            cstate="$(gh api "repos/$REPO/commits/$sha/status" --jq '.state')"
            if [ "$cstate" != "success" ]; then
              echo "skip: commit status = $cstate（門 or prod-smoke が未緑）"; continue
            fi

            # 2) check runs（CI: quality / smoke 等）が全て success/neutral か。
            #    自分自身(auto-merge)の check は「完全一致」で除外して自己デッドロックを防ぐ。
            #    skipped は緑扱いしない（必須 check を skip させて素通りさせる裏口を塞ぐ）。
            #    in-progress/queued(conclusion=null) も未成功扱い＝次イベントで再評価。
            runs="$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "auto-merge")]')"
            total="$(jq 'length' <<<"$runs")"
            bad="$(jq '[.[] | select(.conclusion!="success" and .conclusion!="neutral")] | length' <<<"$runs")"
            if [ "$total" -eq 0 ]; then echo "skip: check runs がまだ無い"; continue; fi
            if [ "$bad" -ne 0 ]; then echo "skip: 未成功の check runs が $bad 件"; continue; fi

            # 3) mergeable（null は GitHub が計算中 → 見送り、次イベントで再評価）
            if [ "$mergeable" != "true" ]; then echo "skip: mergeable=$mergeable"; continue; fi

            echo "全緑 → PR #$pr を squash マージ"
            gh pr merge "$pr" --squash --delete-branch --repo "$REPO" \
              && echo "merged #$pr" \
              || echo "merge 失敗（競合/権限/タイミング）。次イベントで再評価。"
          done
