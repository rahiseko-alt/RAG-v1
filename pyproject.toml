[project]
name = "medguide-rag"
version = "0.1.0"
description = "Local fail-closed RAG quality workbench with revision, verification, audit, and coverage-loop support."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==0.120.2",
    "chromadb==1.5.9",
    "fastapi==0.141.1",
    "langchain==1.3.11",
    "langchain-anthropic==1.4.8",
    "langchain-chroma==1.1.0",
    "langchain-huggingface==1.2.2",
    "langchain-openai==1.4.1",
    "langchain-text-splitters==1.1.2",
    "langfuse==4.14.1",
    "langgraph==1.2.10",
    "numpy==2.5.0",
    "pandas==3.0.3",
    "pydantic==2.13.4",
    "pypdf==6.14.2",
    "python-dotenv==1.2.2",
    "scikit-learn==1.9.0",
    "sentence-transformers==5.6.0",
    "torch==2.12.1",
    "uvicorn==0.52.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter==1.1.1",
    "matplotlib==3.11.0",
    "nbconvert==7.17.1",
]
dev = [
    "httpx==0.28.1",
    "mypy==1.20.0",
    "pytest==9.1.1",
    "pytest-playwright==0.8.0",
    "ruff==0.14.9",
]

[project.scripts]
medguide-rag = "src.rag.cli:main"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
