[pytest]
testpaths = tests
# 既定では e2e と slow を除外し、ローカルと CI の結果を一致させる。
# - e2e : Playwright のブラウザバイナリと、127.0.0.1:8010 で起動済みの
#         uvicorn を要求する（dev extras を入れると skipif が外れて実行される）
# - slow: HuggingFace から埋め込みモデルを取得し、リポジトリ直下に chroma/ を作る
# どちらも手動実行の手順は AGENTS.md「Testing instructions」に記載。
# コマンドラインで -m を明示すればこの既定は上書きされる
# （例: uv run pytest tests/e2e -m e2e）。
addopts = -m "not e2e and not slow"
markers =
    slow: integration tests that build indexes or call heavier dependencies
    e2e: browser-based workbench flow tests
